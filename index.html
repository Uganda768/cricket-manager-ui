
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Select Your Team</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
    h1 { text-align: center; }
    .team-list { display: flex; flex-wrap: wrap; justify-content: center; }
    .team-card {
      background: white;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 15px;
      margin: 10px;
      width: 280px;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
    }
    .team-card h3 { margin-top: 0; }
    .team-card button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
    }
    .team-card button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <h1>Choose Your Team</h1>
  <div class="team-list" id="teamList"></div>

  <script>
    async function loadTeams() {
      const response = await fetch("league_teams.json");
      const teams = await response.json();
      const teamList = document.getElementById("teamList");

      teams.forEach((team, index) => {
        const div = document.createElement("div");
        div.className = "team-card";
        div.innerHTML = `
          <h3>${team.team_name}</h3>
          <p><strong>Home Ground:</strong> ${team.ground}</p>
          <p><strong>Players:</strong> ${team.players.length}</p>
          <button onclick="selectTeam(${index})">Select This Team</button>
        `;
        teamList.appendChild(div);
      });
    }

    function selectTeam(index) {
      localStorage.setItem("selectedTeamIndex", index);
      alert("You have selected team #" + (index + 1));
    }

    loadTeams();
  </script>
</body>
</html>
